name: Update screener data

on:
  schedule:
    # Times are UTC (IST = UTC + 5:30)
    - cron: "15,45 4-9 * * 1-5"   # every 30 min, 09:45-15:15 IST: live (≈15-min delayed) prices
    - cron: "5 10 * * 1-5"        # 15:35 IST: closing prices
    - cron: "45 12 * * 1-5"       # 18:15 IST: NSE end-of-day bhavcopy
    - cron: "30 14 * * 1-5"       # 20:00 IST: retry if NSE published late
    - cron: "30 16 * * 1-5"       # 22:00 IST: final retry
    - cron: "30 2 * * *"          # 08:00 IST daily (also catches special weekend sessions)
  workflow_dispatch: {}            # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write   # commit newly downloaded NSE days to data/
  pages: write
  id-token: write

concurrency:
  group: screener-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps: 
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download NSE data and build the screener
        run: python scripts/build_data.py
        
      - name: Build the Sector Rotation & Relative Strength page data
        # A failure here never blocks the screener; the rotation page then shows "data not found" until the next good run.
        continue-on-error: true
        run: python scripts/build_rotation.py

      - name: Save new NSE data to the repository
        run: |
          git config user.name "screener-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new NSE files"
          else
            git commit -m "NSE data $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"         
            git pull --rebase --autostash -X theirs
            git push
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSE Camarilla Screener</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M6 22h20M6 16h20M6 10h20' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7fb; --panel:#fff; --ink:#1d2433; --muted:#667085; --line:#e6e8ef; --soft:#f2f3f8;
  --accent:#4f46e5; --accent-soft:#eef0ff; --up:#0f9d58; --down:#d93025; --warn:#b45309; --warn-soft:#fff7e6;
  --r:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.status{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:6px}
.pill{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill b{color:var(--ink);font-weight:600}
.pill.live{background:#e8f7ee;color:#0b6b3a}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:#c9cdd8;background:#fafbff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#4338ca}
.btn.ghost{border-color:transparent;background:transparent}.btn.sm{padding:4px 9px;font-size:12.5px}
.layout{display:grid;grid-template-columns:350px 1fr;gap:14px;padding:14px 18px;align-items:start}
aside{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:sticky;top:66px;max-height:calc(100vh - 80px);overflow:auto}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row>label{min-width:84px;color:var(--muted);font-size:13px}
select,input[type=text],input[type=number],input[type=search]{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;min-width:0;width:100%}
select:focus,input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.cond{border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:8px;background:#fcfcfe}
.cond .line{display:grid;grid-template-columns:1fr 1.25fr;gap:6px;margin-bottom:6px}
.cond .line2{display:grid;grid-template-columns:1fr 1fr 28px;gap:6px;align-items:center}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:0}
.x:hover{color:var(--down)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 10px;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--accent);color:#fff}
.check{display:flex;gap:7px;align-items:center;font-size:13px;margin:4px 0;cursor:pointer}
details{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
details:first-of-type{border-top:0;margin-top:0;padding-top:0}
summary{cursor:pointer;font-weight:600;font-size:13px;padding:4px 0;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted)} details[open] summary::after{content:"–"}
.rng{display:grid;grid-template-columns:1fr 70px 70px;gap:6px;align-items:center;margin:5px 0}
.rng span{font-size:12.5px;color:#344054}
.rng input{padding:4px 6px;font-size:12.5px}
.rng.active span{color:var(--accent);font-weight:600}
.badge{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px}
main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.count{font-size:15px}.count b{font-size:18px}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px}
.active-filters:empty{display:none}
.af{background:var(--soft);border-radius:6px;padding:3px 8px;color:#344054}
.tablewrap{overflow:auto;max-height:calc(100vh - 210px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{position:sticky;top:0;background:#fafbfc;z-index:2;font-weight:600;color:#475467;cursor:pointer;user-select:none;font-size:12px}
th:hover{color:var(--accent)} th.sorted{color:var(--accent)}
th.l,td.l{text-align:left}
td.sym{position:sticky;left:0;background:inherit;z-index:1;text-align:left}
th.sym{position:sticky;left:0;z-index:3}
tbody tr{background:#fff;cursor:pointer} tbody tr:nth-child(even){background:#fbfbfd}
tbody tr:hover{background:var(--accent-soft)}
.symb{font-weight:600;color:var(--ink)} .nm{color:var(--muted);font-size:11.5px;max-width:190px;overflow:hidden;text-overflow:ellipsis;display:block}
.up{color:var(--up)}.down{color:var(--down)}.na{color:#b0b6c3}
.zone{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--soft)}
.zone.hiR{background:#e7f6ec;color:#0b6b3a}.zone.midR{background:#eef6ff;color:#1d4ed8}.zone.loS{background:#fdecec;color:#a61b1b}
.tag{font-size:10.5px;border-radius:4px;padding:1px 5px;margin-left:5px;background:var(--soft);color:var(--muted);font-weight:600;vertical-align:1px}
.more{padding:12px;text-align:center}
.empty{padding:40px;text-align:center;color:var(--muted)}
.banner{margin:0 18px;margin-top:12px;padding:10px 14px;border-radius:9px;background:var(--warn-soft);color:var(--warn);border:1px solid #f6d9a8;font-size:13px}
.banner:empty{display:none}
/* drawer & modal */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:40;display:none}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .2s ease;overflow:auto;box-shadow:-8px 0 30px rgba(16,24,40,.15)}
.drawer.open{transform:none}
.dhead{background:#fff;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.dhead h2{margin:0;font-size:24px;letter-spacing:-.02em}
.dprice{font-size:20px;font-weight:700;margin-top:4px}
.links{display:flex;gap:14px;margin-top:8px;font-size:13px;flex-wrap:wrap}
.dbody{padding:16px 22px 40px}
.ratios{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px;padding:14px 18px}
.ratio{display:flex;justify-content:space-between;padding:9px 10px;border-radius:7px;font-size:14px}
.ratio:nth-child(6n+1),.ratio:nth-child(6n+2),.ratio:nth-child(6n+3){background:#f6f7fb}
.ratio span:first-child{color:#475467}.ratio span:last-child{font-weight:600}
.lvls{width:100%;font-size:13px}
.lvls th{position:static;cursor:default;background:#fafbfc}
.lvls td.hit{background:var(--accent-soft);font-weight:700;color:var(--accent)}
.lvls tr.cmp td{background:#fff8e6;font-weight:700;color:var(--warn)}
.sub{font-size:12px;color:var(--muted)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);max-height:86vh;overflow:auto;background:#fff;border-radius:14px;z-index:60;display:none;box-shadow:0 20px 60px rgba(16,24,40,.25)}
.modal.open{display:block}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}
.modal .mb{padding:16px 20px;line-height:1.55}
.colgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px}
.mobile-only{display:none}
code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12.5px}
@media (max-width:980px){
  header{padding:8px 10px;gap:8px}
  header .btn{padding:5px 9px;font-size:12.5px}
  .brand{font-size:15px}
  .status .pill:last-child{display:none}
  .layout{grid-template-columns:1fr;padding:10px}
  aside{position:fixed;left:0;top:0;bottom:0;width:min(380px,92vw);max-height:none;z-index:45;border-radius:0;transform:translateX(-102%);transition:transform .2s}
  aside.open{transform:none}
  .mobile-only{display:inline-flex}
  .ratios{grid-template-columns:1fr 1fr}
  .tablewrap{max-height:none}
  .colgrid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header>
  <button class="btn mobile-only" id="btnFilters">☰ Filters</button>
  <div class="brand"><div class="logo"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 12h12M2 8h12M2 4h12" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></div>NSE Camarilla Screener</div>
  <div class="status" id="status"><span class="pill">Loading data…</span></div>
  <div class="spacer"></div>
  <a class="btn" href="rotation.html" title="Sector rotation, RRG, relative strength and market breadth">Sector rotation ↗</a>
  <a class="btn" href="smartmoney.html" title="Smart-money footprints, institutional accumulation, setups and post-move analysis">Smart money ↗</a>
  <button class="btn" id="btnReload" title="Fetch the latest published data">↻ Reload data</button>
  <button class="btn" id="btnCols">Columns</button>
  <button class="btn" id="btnCsv">Export CSV</button>
  <button class="btn ghost" id="btnHelp">Help</button>
</header>
<div class="banner" id="banner"></div>

<div class="layout">
<aside id="side">
  <div class="sec">
    <h3>Quick screens</h3>
    <div class="chips" id="presets"></div>
  </div>
  <div class="sec">
    <h3>Pivot levels</h3>
    <div class="row"><label>Type</label><select id="pivType"></select></div>
    <div class="row"><label>Period</label><select id="tf"></select></div>
    <div class="row"><label>Levels for</label>
      <div class="seg" id="basis"><button data-v="cur" class="on">Current period</button><button data-v="next">Next period</button></div></div>
    <div class="sub" id="periodNote" style="margin:-2px 0 10px"></div>
    <div id="conds"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn sm" id="addCond">+ Add condition</button>
      <div class="seg" id="match"><button data-v="all" class="on">Match all</button><button data-v="any">Any</button></div>
    </div>
  </div>
  <div class="sec">
    <h3>Universe</h3>
    <div class="row"><input type="search" id="q" placeholder="Search symbol or company…"></div>
    <div class="row"><label>Index</label><select id="index"></select></div>
    <div class="row"><label>Sector</label><select id="sector"></select></div>
    <label class="check"><input type="checkbox" id="fo"> F&amp;O stocks only</label>
    <label class="check"><input type="checkbox" id="sme"> Include SME stocks</label>
    <label class="check"><input type="checkbox" id="bebz" checked> Include BE / BZ series</label>
    <label class="check"><input type="checkbox" id="stale" checked> Hide stocks not traded on latest day</label>
  </div>
  <div class="sec">
    <h3>Fundamentals &amp; technicals <button class="btn ghost sm" id="clearRanges">Clear</button></h3>
    <div id="ranges"></div>
  </div>
  <div class="sec" style="display:flex;gap:8px">
    <button class="btn" id="reset" style="flex:1">Reset everything</button>
    <button class="btn primary mobile-only" id="closeSide" style="flex:1">Show results</button>
  </div>
</aside>

<main>
  <div class="card">
    <div class="toolbar">
      <div class="count" id="count"></div>
      <div class="spacer"></div>
      <span class="sub">Level columns</span>
      <div class="chips" id="lvlChips"></div>
      <span class="sub">Δ% vs</span>
      <select id="distLvl" style="width:auto"></select>
    </div>
    <div class="active-filters" id="activeFilters"></div>
    <div class="tablewrap" id="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
      <div class="more" id="more"></div></div>
  </div>
</main>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"><div class="mh"><b id="mtitle"></b><button class="x" id="mclose">×</button></div><div class="mb" id="mbody"></div></div>

<script>
"use strict";
/* ------------------------------------------------------------------ constants */
const TF_NAMES = {D:"Daily",W:"Weekly",M:"Monthly",Q:"Quarterly",Y:"Yearly"};
const TYPES = {
  Camarilla:{levels:["R5","R4","R3","R2","R1","P","S1","S2","S3","S4","S5"], zoneP:false,
    f:(H,L,C)=>{const R=H-L,P=(H+L+C)/3,R5=H/L*C;return{P,R1:C+1.1*R/12,R2:C+1.1*R/6,R3:C+1.1*R/4,R4:C+1.1*R/2,R5,
      S1:C-1.1*R/12,S2:C-1.1*R/6,S3:C-1.1*R/4,S4:C-1.1*R/2,S5:C-(R5-C)}}},
  Traditional:{levels:["R5","R4","R3","R2","R1","P","S1","S2","S3","S4","S5"], zoneP:true,
    f:(H,L,C)=>{const P=(H+L+C)/3;return{P,R1:2*P-L,S1:2*P-H,R2:P+(H-L),S2:P-(H-L),R3:2*P+(H-2*L),S3:2*P-(2*H-L),
      R4:3*P+(H-3*L),S4:3*P-(3*H-L),R5:4*P+(H-4*L),S5:4*P-(4*H-L)}}},
  Classic:{levels:["R4","R3","R2","R1","P","S1","S2","S3","S4"], zoneP:true,
    f:(H,L,C)=>{const P=(H+L+C)/3,R=H-L;return{P,R1:2*P-L,S1:2*P-H,R2:P+R,S2:P-R,R3:P+2*R,S3:P-2*R,R4:P+3*R,S4:P-3*R}}},
  Fibonacci:{levels:["R3","R2","R1","P","S1","S2","S3"], zoneP:true,
    f:(H,L,C)=>{const P=(H+L+C)/3,R=H-L;return{P,R1:P+.382*R,S1:P-.382*R,R2:P+.618*R,S2:P-.618*R,R3:P+R,S3:P-R}}},
  Woodie:{levels:["R4","R3","R2","R1","P","S1","S2","S3","S4"], zoneP:true,
    f:(H,L,C,O,cO)=>{const P=(H+L+2*cO)/4,R=H-L,R3=H+2*(P-L),S3=L-2*(H-P);return{P,R1:2*P-L,S1:2*P-H,R2:P+R,S2:P-R,R3,S3,R4:R3+R,S4:S3-R}}},
  DM:{levels:["R1","P","S1"], zoneP:true,
    f:(H,L,C,O)=>{const X=O===C?H+L+2*C:(C>O?2*H+L+C:2*L+H+C);return{P:X/4,R1:X/2-L,S1:X/2-H}}},
};
const EXTRA_LEVELS = [["PH","Prev period high"],["PL","Prev period low"],["PC","Prev period close"]];
const SUBJECTS = [["cmp","Price (CMP)"],["phigh","Period high so far"],["plow","Period low so far"],["popen","Period open"]];
const OPS = [["above","is above"],["below","is below"],["between","is between"],["near","is within ±% of"],
             ["xup","crossed above (last N days)"],["xdown","crossed below (last N days)"]];
const PRESETS = [
  {id:"brk4", label:"Above R4 (breakout)", conds:[{s:"cmp",op:"above",a:"R4"}]},
  {id:"r34", label:"Between R3 & R4", conds:[{s:"cmp",op:"between",a:"R3",b:"R4"}]},
  {id:"r23", label:"Between R2 & R3", conds:[{s:"cmp",op:"between",a:"R2",b:"R3"}]},
  {id:"nr3", label:"Near R3 (±2%)", conds:[{s:"cmp",op:"near",a:"R3",pct:2}]},
  {id:"nr4", label:"Near R4 (±2%)", conds:[{s:"cmp",op:"near",a:"R4",pct:2}]},
  {id:"x4", label:"Crossed above R4 (5 days)", conds:[{s:"cmp",op:"xup",a:"R4",n:5}]},
  {id:"x3", label:"Crossed above R3 (5 days)", conds:[{s:"cmp",op:"xup",a:"R3",n:5}]},
  {id:"t4", label:"Touched R4 this period", conds:[{s:"phigh",op:"above",a:"R4"}]},
  {id:"r5", label:"Above R5", conds:[{s:"cmp",op:"above",a:"R5"}]},
  {id:"s34", label:"Between S3 & S4", conds:[{s:"cmp",op:"between",a:"S3",b:"S4"}]},
  {id:"bs3", label:"Below S3", conds:[{s:"cmp",op:"below",a:"S3"}]},
  {id:"bs4", label:"Below S4 (breakdown)", conds:[{s:"cmp",op:"below",a:"S4"}]},
];
/* fmt: p=price, x=multiple, pct=%, pctS=signed %, cr=₹ crore, int, txt, date */
const FIELDS = [
  {k:"close",l:"CMP ₹",g:"Price",f:"p"},
  {k:"chg",l:"Chg %",g:"Price",f:"pctS"},
  {k:"mcap",l:"Mkt Cap ₹Cr",g:"Valuation",f:"cr",r:1},
  {k:"pe",l:"P/E",g:"Valuation",f:"x",r:1},
  {k:"ind_pe",l:"Industry P/E",g:"Valuation",f:"x",r:1},
  {k:"pe_vs_ind",l:"P/E ÷ Industry P/E",g:"Valuation",f:"x",r:1},
  {k:"pb",l:"Price / Book",g:"Valuation",f:"x",r:1},
  {k:"peg",l:"PEG",g:"Valuation",f:"x",r:1},
  {k:"mcap_sales",l:"Mkt Cap / Sales",g:"Valuation",f:"x",r:1},
  {k:"cmp_fcf",l:"CMP / FCF",g:"Valuation",f:"x",r:1},
  {k:"ev_ebitda",l:"EV / EBITDA",g:"Valuation",f:"x",r:1},
  {k:"dy",l:"Dividend yield %",g:"Valuation",f:"pct",r:1},
  {k:"bv",l:"Book value ₹",g:"Valuation",f:"p"},
  {k:"eps",l:"EPS ₹ (TTM)",g:"Valuation",f:"p",r:1},
  {k:"roce",l:"ROCE %",g:"Quality",f:"pct",r:1},
  {k:"roe",l:"ROE %",g:"Quality",f:"pct",r:1},
  {k:"roe_ttm",l:"ROE % (TTM)",g:"Quality",f:"pct",r:1},
  {k:"roic",l:"ROIC %",g:"Quality",f:"pct",r:1},
  {k:"roa",l:"ROA %",g:"Quality",f:"pct",r:1},
  {k:"opm",l:"OPM %",g:"Quality",f:"pct",r:1},
  {k:"npm",l:"Net margin %",g:"Quality",f:"pct",r:1},
  {k:"de",l:"Debt / Equity",g:"Quality",f:"x",r:1},
  {k:"cur_ratio",l:"Current ratio",g:"Quality",f:"x",r:1},
  {k:"int_cov",l:"Interest coverage",g:"Quality",f:"x",r:1},
  {k:"pio",l:"Piotroski score",g:"Quality",f:"int",r:1},
  {k:"sales_g",l:"Sales growth % (TTM)",g:"Growth",f:"pctS",r:1},
  {k:"profit_g",l:"Profit growth % (TTM)",g:"Growth",f:"pctS",r:1},
  {k:"eps_g",l:"EPS growth % (TTM)",g:"Growth",f:"pctS",r:1},
  {k:"sales_g_fy",l:"Sales growth % (last FY)",g:"Growth",f:"pctS",r:1},
  {k:"profit_g_fy",l:"Profit growth % (last FY)",g:"Growth",f:"pctS",r:1},
  {k:"sales_cr",l:"Sales ₹Cr (TTM)",g:"Growth",f:"cr",r:1},
  {k:"profit_cr",l:"Net profit ₹Cr (TTM)",g:"Growth",f:"cr",r:1},
  {k:"rsi",l:"RSI (14, daily)",g:"Technical",f:"x",r:1},
  {k:"from_h52",l:"% below 52W high",g:"Technical",f:"pct",r:1},
  {k:"from_l52",l:"% above 52W low",g:"Technical",f:"pct",r:1},
  {k:"vs_ema200",l:"% vs EMA 200",g:"Technical",f:"pctS",r:1},
  {k:"vs_ema50",l:"% vs EMA 50",g:"Technical",f:"pctS",r:1},
  {k:"r_1w",l:"Return 1W %",g:"Technical",f:"pctS",r:1},

];
const FIELD = Object.fromEntries(FIELDS.map(f=>[f.k,f]));
const DEFAULT_COLS = ["close","chg","mcap","pe","roce","roe","sales_g","profit_g","de","rsi","industry"];
const OPEN_RANGES = ["mcap","pe","roce","roe","de","sales_g","profit_g","rsi"];
const INDEXES = [["","All NSE stocks"],["N50","Nifty 50"],["NN50","Nifty Next 50"],["N100","Nifty 100"],["N200","Nifty 200"],
  ["N500","Nifty 500"],["MID150","Nifty Midcap 150"],["SML250","Nifty Smallcap 250"],["MICRO250","Nifty Microcap 250"],["NOTN500","Outside Nifty 500"]];
const DEFAULT_STATE = () => ({type:"Camarilla",tf:"Y",basis:"cur",match:"all",
  conds:[{s:"cmp",op:"above",a:"R4",b:"R5",pct:2,n:5}], q:"",index:"",sector:"",fo:false,sme:false,bebz:true,stale:true,
  ranges:{}, sort:{k:"mcap",d:-1}, cols:DEFAULT_COLS.slice(), lvl:["R2","R3","R4"], dist:"R4"});

/* ------------------------------------------------------------------ state */
let D = null, ROWS = [], VIEW = [], LIMIT = 300;
let S = loadState();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function loadState(){
  let s = DEFAULT_STATE();
  try{
    if (location.hash.length > 2) s = Object.assign(s, JSON.parse(decodeURIComponent(location.hash.slice(1))));
    else { const ls = localStorage.getItem("ncs_state"); if (ls) s = Object.assign(s, JSON.parse(ls)); }
  }catch(e){}
  if (!TYPES[s.type]) s.type = "Camarilla";
  if (!TF_NAMES[s.tf]) s.tf = "Y";
  return s;
}
function saveState(){
  const j = JSON.stringify(S);
  try{ localStorage.setItem("ncs_state", j); }catch(e){}
  try{ history.replaceState(null, "", "#" + encodeURIComponent(j)); }catch(e){}
}

/* ------------------------------------------------------------------ data loading */
function loadData(){
  $("status").innerHTML = '<span class="pill">Loading latest data…</span>';
  const old = document.getElementById("dataScript"); if (old) old.remove();
  delete window.SCREENER_DATA;
  const sc = document.createElement("script");
  sc.id = "dataScript"; sc.src = "data.js?v=" + Date.now();
  sc.onload = () => { if (window.SCREENER_DATA) init(window.SCREENER_DATA); else fail(); };
  sc.onerror = fail;
  document.head.appendChild(sc);
}
function fail(){
  $("status").innerHTML = '<span class="pill warn">Data not available yet</span>';
  $("banner").innerHTML = "No data file found. If you just set this up, open your repository's <b>Actions</b> tab and run the " +
    "<b>Update screener data</b> workflow once (first run takes ~10–15 minutes). Running locally? Run <code>python scripts/build_data.py</code> first.";
  $("tbody").innerHTML = ""; $("count").textContent = "";
}

function init(data){
  D = data;
  const cols = data.cols;
  ROWS = data.rows.map((r, i) => {
    const o = {}; cols.forEach((c, j) => o[c] = r[j]);
    o.i = i;
    o.idxs = new Set((o.idx || "").split(",").filter(Boolean));
    o.from_h52 = o.h52 && o.close ? (1 - o.close / o.h52) * 100 : null;
    o.from_l52 = o.l52 && o.close ? (o.close / o.l52 - 1) * 100 : null;
    o.vs_ema200 = o.ema200 ? (o.close / o.ema200 - 1) * 100 : null;
    o.vs_ema50 = o.ema50 ? (o.close / o.ema50 - 1) * 100 : null;
    o.pe_vs_ind = o.pe && o.ind_pe ? o.pe / o.ind_pe : null;
    o.stale = o.last !== data.meta.latest;
    o.cl = data.cl[i] || [];
    return o;
  });
  renderStatus(); buildControls(); recompute();
}

function renderStatus(){
  const m = D.meta, p = [];
  p.push(`<span class="pill">NSE EOD <b>${fmtDate(m.nse_date)}</b></span>`);
  if (m.live) p.push(`<span class="pill live">● Live ${fmtDate(m.live.date)} <b>${m.live.time}</b> IST <span style="opacity:.75">(~15 min delayed)</span></span>`);
  p.push(`<span class="pill"><b>${m.count.toLocaleString("en-IN")}</b> stocks</span>`);
  if (!m.fundamentals) p.push(`<span class="pill warn">Fundamentals unavailable this run</span>`);
  p.push(`<span class="pill" title="When the data file was built">Built ${esc(m.generated)}</span>`);
  $("status").innerHTML = p.join("");
  $("banner").innerHTML = m.fundamentals ? "" :
    "Fundamentals (P/E, ROCE, ROE…) could not be fetched in the latest run, so those columns are empty. Price data and pivot levels are unaffected.";
}
function fmtDate(s){ if(!s) return "–"; const d = new Date(s + "T00:00:00"); return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}); }

/* ------------------------------------------------------------------ pivots */
function levelsFor(o, type, tf, basis){
  const p = D.piv[tf][o.i]; if (!p) return null;
  let O,H,L,C,cO;
  if (basis === "next"){ if (p[5] == null) return null; O = p[4]; H = p[5]; L = p[6]; C = o.close; cO = o.close; }
  else { if (p[1] == null) return null; [O,H,L,C] = p; cO = p[4] ?? C; }
  if (!(H > 0 && L > 0)) return null;
  const lv = TYPES[type].f(H, L, C, O, cO);
  lv.PH = H; lv.PL = L; lv.PC = C;
  return lv;
}
function zoneOf(close, lv, type){
  if (!lv) return {z:"–", r:-99, cls:""};
  const names = TYPES[type].levels.filter(n => n !== "P" || TYPES[type].zoneP);
  const lad = names.map(n => [n, lv[n]]).filter(x => x[1] != null && isFinite(x[1])).sort((a,b) => a[1]-b[1]);
  let k = -1; for (let i = 0; i < lad.length; i++) if (close >= lad[i][1]) k = i;
  let z, cls;
  if (k < 0) z = "< " + lad[0][0];
  else if (k === lad.length - 1) z = "> " + lad[k][0];
  else z = lad[k][0] + "–" + lad[k+1][0];
  const top = k >= 0 ? lad[k][0] : "S9";
  cls = /^R[3-9]/.test(top) ? "hiR" : /^(R|P)/.test(top) ? "midR" : /^S[3-9]/.test(top) || k < 0 ? "loS" : "";
  return {z, r:k, cls};
}
function recompute(){
  for (const o of ROWS){
    o.L = levelsFor(o, S.type, S.tf, S.basis);
    const z = zoneOf(o.close, o.L, S.type); o.zone = z.z; o.zr = z.r; o.zcls = z.cls;
    o.dist = o.L && o.L[S.dist] ? (o.close / o.L[S.dist] - 1) * 100 : null;
    const p = D.piv[S.tf][o.i];
    o.pH = p ? p[5] : null; o.pLo = p ? p[6] : null; o.pO = p ? p[4] : null;
  }
  applyFilters();
}

/* ------------------------------------------------------------------ filtering */
function subjVal(o, s){ return s === "cmp" ? o.close : s === "phigh" ? o.pH : s === "plow" ? o.pLo : o.pO; }
function testCond(o, c){
  if (!o.L) return false;
  const A = o.L[c.a]; if (A == null || !isFinite(A)) return false;
  const v = subjVal(o, c.s); if (v == null) return false;
  switch (c.op){
    case "above": return v > A;
    case "below": return v < A;
    case "between": { const B = o.L[c.b]; if (B == null) return false; return v >= Math.min(A,B) && v <= Math.max(A,B); }
    case "near": return Math.abs(v / A - 1) * 100 <= (+c.pct || 0);
    case "xup": case "xdown": {
      const n = Math.max(1, Math.min(10, +c.n || 5)); const prior = o.cl.slice(-1 - n, -1);
      if (c.op === "xup") return o.close > A && prior.some(x => x <= A);
      return o.close < A && prior.some(x => x >= A);
    }
  }
  return true;
}
function applyFilters(){
  const q = S.q.trim().toUpperCase();
  const conds = S.conds.filter(c => c.a);
  const rng = Object.entries(S.ranges).filter(([k,v]) => v && (v[0] !== "" && v[0] != null || v[1] !== "" && v[1] != null));
  VIEW = ROWS.filter(o => {
    if (q && !(o.sym.includes(q) || (o.name || "").toUpperCase().includes(q))) return false;
    if (!S.sme && o.sme) return false;
    if (!S.bebz && (o.series === "BE" || o.series === "BZ")) return false;
    if (S.stale && o.stale) return false;
    if (S.fo && !o.fo) return false;
    if (S.index === "NOTN500" ? o.idxs.has("N500") : (S.index && !o.idxs.has(S.index))) return false;
    if (S.sector && o.sector !== S.sector) return false;
    for (const [k,[mn,mx]] of rng){
      const v = o[k];
      if (v == null) return false;
      if (mn !== "" && mn != null && v < +mn) return false;
      if (mx !== "" && mx != null && v > +mx) return false;
    }
    if (conds.length){
      const res = conds.map(c => testCond(o, c));
      if (S.match === "all" ? !res.every(Boolean) : !res.some(Boolean)) return false;
    }
    return true;
  });
  sortView(); LIMIT = 300; renderTable(); renderActive(); saveState();
}
function sortView(){
  const {k, d} = S.sort;
  const get = k === "zone" ? (o => o.zr) : k.startsWith("L:") ? (o => o.L ? o.L[k.slice(2)] : null) : (o => o[k]);
  VIEW.sort((a, b) => {
    const x = get(a), y = get(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    if (typeof x === "string") return x.localeCompare(y) * d;
    return (x - y) * d;
  });
}

/* ------------------------------------------------------------------ formatting */
function fmt(v, f){
  if (v == null || v === "" || (typeof v === "number" && !isFinite(v))) return '<span class="na">–</span>';
  switch (f){
    case "p": return v.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
    case "x": return Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("en-IN") : v.toFixed(2);
    case "pct": return v.toFixed(1);
    case "pctS": return `<span class="${v>0?"up":v<0?"down":""}">${v>0?"+":""}${v.toFixed(1)}</span>`;
    case "cr": return Math.round(v).toLocaleString("en-IN");
    case "int": return Math.round(v).toLocaleString("en-IN");
    default: return esc(v);
  }
}
const plain = (v, f) => v == null ? "" : (typeof v === "number" ? (f === "int" || f === "cr" ? Math.round(v) : +v.toFixed(2)) : v);

/* ------------------------------------------------------------------ table */
function columns(){
  const cols = [{k:"sym",l:"Stock",cls:"l sym"}];
  const lead = S.cols.filter(k => k === "close" || k === "chg"), rest = S.cols.filter(k => !lead.includes(k));
  for (const k of lead) if (FIELD[k]) cols.push({k, l:FIELD[k].l, f:FIELD[k].f, cls:""});
  cols.push({k:"zone", l:`Zone (${TF_NAMES[S.tf]})`, cls:"l"});
  for (const n of S.lvl) if (TYPES[S.type].levels.includes(n) || ["PH","PL","PC"].includes(n)) cols.push({k:"L:"+n, l:n, f:"p"});
  cols.push({k:"dist", l:`Δ% vs ${S.dist}`, f:"pctS"});
  for (const k of rest) if (FIELD[k]) cols.push({k, l:FIELD[k].l, f:FIELD[k].f, cls:FIELD[k].f==="txt"?"l":""});
  return cols;
}
function renderTable(){
  const cols = columns();
  $("thead").innerHTML = "<tr>" + cols.map(c => `<th class="${c.cls||""} ${S.sort.k===c.k?"sorted":""}" data-k="${c.k}">${esc(c.l)}${S.sort.k===c.k?(S.sort.d>0?" ▲":" ▼"):""}</th>`).join("") + "</tr>";
  const n = VIEW.length;
  $("count").innerHTML = `<b>${n.toLocaleString("en-IN")}</b> of ${ROWS.length.toLocaleString("en-IN")} stocks match`;
  if (!n){ $("tbody").innerHTML = ""; $("more").innerHTML = '<div class="empty">No stocks match these filters. Try widening a range or removing a condition.</div>'; return; }
  const html = [];
  for (const o of VIEW.slice(0, LIMIT)){
    html.push(`<tr data-i="${o.i}">` + cols.map(c => {
      if (c.k === "sym") return `<td class="l sym"><span class="symb">${esc(o.sym)}</span>${o.fo?'<span class="tag">F&O</span>':""}${o.sme?'<span class="tag">SME</span>':""}${o.series!=="EQ"&&!o.sme?`<span class="tag">${esc(o.series)}</span>`:""}<span class="nm">${esc(o.name)}</span></td>`;
      if (c.k === "zone") return `<td class="l"><span class="zone ${o.zcls}">${esc(o.zone)}</span></td>`;
      if (c.k.startsWith("L:")) return `<td>${fmt(o.L ? o.L[c.k.slice(2)] : null, "p")}</td>`;
      return `<td class="${c.cls||""}">${fmt(o[c.k], c.f)}</td>`;
    }).join("") + "</tr>");
  }
  $("tbody").innerHTML = html.join("");
  $("more").innerHTML = n > LIMIT ? `<button class="btn" id="showMore">Show all ${n.toLocaleString("en-IN")} rows</button>` : "";
}
function renderActive(){
  const a = [];
  a.push(`${S.type} · ${TF_NAMES[S.tf]} · ${S.basis === "cur" ? "current period" : "next period"}`);
  S.conds.filter(c=>c.a).forEach(c => a.push(condText(c)));
  if (S.index) a.push(INDEXES.find(x=>x[0]===S.index)[1]);
  if (S.sector) a.push(S.sector);
  if (S.fo) a.push("F&O only");
  for (const [k,[mn,mx]] of Object.entries(S.ranges)){
    const has0 = mn !== "" && mn != null, has1 = mx !== "" && mx != null;
    if (has0 || has1) a.push(`${FIELD[k]?.l || k} ${has0&&has1?`${mn} – ${mx}`:has0?`≥ ${mn}`:`≤ ${mx}`}`);
  }
  $("activeFilters").innerHTML = a.map(x => `<span class="af">${esc(x)}</span>`).join("");
}
function condText(c){
  const subj = SUBJECTS.find(s=>s[0]===c.s)[1].replace(" (CMP)","");
  const op = {above:"above",below:"below",between:"between",near:"within ±"+c.pct+"% of",xup:`crossed above (${c.n}d)`,xdown:`crossed below (${c.n}d)`}[c.op];
  return `${subj} ${op} ${c.a}${c.op==="between"?" & "+c.b:""}`;
}

/* ------------------------------------------------------------------ controls */
function levelOptions(sel){
  const lv = TYPES[S.type].levels.concat(EXTRA_LEVELS.map(x=>x[0]));
  return lv.map(n => `<option value="${n}" ${n===sel?"selected":""}>${n}${EXTRA_LEVELS.find(x=>x[0]===n)?" – "+EXTRA_LEVELS.find(x=>x[0]===n)[1]:""}</option>`).join("");
}
function normConds(){
  const avail = TYPES[S.type].levels.concat(EXTRA_LEVELS.map(x=>x[0]));
  const pick = (want, fb) => avail.includes(want) ? want : (avail.includes(fb) ? fb : avail[0]);
  for (const c of S.conds){ c.a = pick(c.a, "R4"); c.b = pick(c.b || "R5", "R4"); if (c.pct == null) c.pct = 2; if (c.n == null) c.n = 5; }
}
function renderConds(){
  normConds();
  $("conds").innerHTML = S.conds.map((c, i) => `
    <div class="cond" data-i="${i}">
      <div class="line">
        <select data-f="s">${SUBJECTS.map(s=>`<option value="${s[0]}" ${s[0]===c.s?"selected":""} ${S.basis==="next"&&s[0]!=="cmp"?"disabled":""}>${s[1]}</option>`).join("")}</select>
        <select data-f="op">${OPS.map(s=>`<option value="${s[0]}" ${s[0]===c.op?"selected":""}>${s[1]}</option>`).join("")}</select>
      </div>
      <div class="line2">
        <select data-f="a">${levelOptions(c.a)}</select>
        ${c.op==="between" ? `<select data-f="b">${levelOptions(c.b||"R5")}</select>`
          : c.op==="near" ? `<input type="number" step="0.1" min="0" data-f="pct" value="${c.pct ?? 2}" title="± percent">`
          : (c.op==="xup"||c.op==="xdown") ? `<input type="number" min="1" max="10" data-f="n" value="${c.n ?? 5}" title="look-back trading days (1–10)">`
          : `<span></span>`}
        <button class="x" data-del="${i}" title="Remove">×</button>
      </div>
    </div>`).join("") || '<div class="sub" style="margin-bottom:8px">No level conditions – showing all stocks.</div>';
  document.querySelectorAll("#presets .chip").forEach(ch => {
    const p = PRESETS.find(x=>x.id===ch.dataset.id);
    ch.classList.toggle("on", S.conds.length===1 && p.conds.length===1 && sameCond(S.conds[0], p.conds[0]));
  });
}
const sameCond = (a, b) => a.s===b.s && a.op===b.op && a.a===b.a && (b.op!=="between"||a.b===b.b) && (b.op!=="near"||+a.pct===+b.pct) && (!/^x/.test(b.op)||+a.n===+b.n);

function renderRanges(){
  const groups = [...new Set(FIELDS.filter(f=>f.r).map(f=>f.g))];
  $("ranges").innerHTML = groups.map(g => {
    const fs = FIELDS.filter(f => f.r && f.g === g);
    const nAct = fs.filter(f => { const v = S.ranges[f.k]; return v && ((v[0]!==""&&v[0]!=null)||(v[1]!==""&&v[1]!=null)); }).length;
    const open = g === "Valuation" || g === "Quality" || nAct > 0;
    return `<details ${open?"open":""}><summary>${g}${nAct?`<span class="badge">${nAct}</span>`:""}</summary>` +
      fs.map(f => { const v = S.ranges[f.k] || ["",""]; const act = (v[0]!==""&&v[0]!=null)||(v[1]!==""&&v[1]!=null);
        return `<div class="rng ${act?"active":""}"><span>${esc(f.l)}</span><input type="number" step="any" placeholder="min" data-r="${f.k}" data-j="0" value="${v[0] ?? ""}"><input type="number" step="any" placeholder="max" data-r="${f.k}" data-j="1" value="${v[1] ?? ""}"></div>`; }).join("") + "</details>";
  }).join("");
}
function renderLevelChips(){
  const all = TYPES[S.type].levels.concat(["PH","PL"]);
  $("lvlChips").innerHTML = all.map(n => `<span class="chip ${S.lvl.includes(n)?"on":""}" data-l="${n}" style="padding:3px 8px">${n}</span>`).join("");
  $("distLvl").innerHTML = all.map(n => `<option ${n===S.dist?"selected":""}>${n}</option>`).join("");
}
function renderPeriodNote(){
  const p = D.meta.periods[S.tf];
  $("periodNote").textContent = S.basis === "cur"
    ? `Levels from ${p.prev ?? "–"} H/L/C, valid for ${p.cur}${S.tf==="Y"?" (same as TradingView 'Auto' on a weekly chart)":""}.`
    : `Levels from ${p.cur} so far (developing) – they apply to the next ${TF_NAMES[S.tf].toLowerCase().replace("daily","day").replace("ly","")} period.`;

function buildControls(){
  $("presets").innerHTML = PRESETS.map(p => `<span class="chip" data-id="${p.id}">${esc(p.label)}</span>`).join("");
  $("pivType").innerHTML = Object.keys(TYPES).map(t => `<option ${t===S.type?"selected":""}>${t}</option>`).join("");
  $("tf").innerHTML = ["Y","Q","M","W","D"].map(t => `<option value="${t}" ${t===S.tf?"selected":""}>${TF_NAMES[t]}</option>`).join("");
  document.querySelectorAll("#basis button").forEach(b => b.classList.toggle("on", b.dataset.v === S.basis));
  document.querySelectorAll("#match button").forEach(b => b.classList.toggle("on", b.dataset.v === S.match));
  $("q").value = S.q;
  $("index").innerHTML = INDEXES.map(([v,l]) => `<option value="${v}" ${v===S.index?"selected":""}>${l}</option>`).join("");

  $("fo").checked = S.fo; $("sme").checked = S.sme; $("bebz").checked = S.bebz; $("stale").checked = S.stale;
  renderConds(); renderRanges(); renderLevelChips(); renderPeriodNote();
}

let tmr = null;
const later = fn => { clearTimeout(tmr); tmr = setTimeout(fn, 160); };

function wire(){
  $("presets").addEventListener("click", e => {
    const ch = e.target.closest(".chip"); if (!ch) return;
    const p = PRESETS.find(x=>x.id===ch.dataset.id);
    S.conds = p.conds.map(c => Object.assign({b:"R5",pct:2,n:5}, c));
    const need = p.conds.map(c=>c.a).concat(p.conds.map(c=>c.b).filter(Boolean));
    if (need.some(n => !TYPES[S.type].levels.includes(n))) { S.type = "Camarilla"; $("pivType").value = "Camarilla"; renderLevelChips(); }
    S.dist = p.conds[0].a; renderLevelChips();
    renderConds(); recompute();
  });
  $("pivType").onchange = e => { S.type = e.target.value; S.lvl = S.lvl.filter(n => TYPES[S.type].levels.includes(n) || n==="PH"||n==="PL");
    if (!TYPES[S.type].levels.includes(S.dist)) S.dist = TYPES[S.type].levels[0];
    renderConds(); renderLevelChips(); recompute(); };
  $("tf").onchange = e => { S.tf = e.target.value; renderPeriodNote(); recompute(); };
  $("basis").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.basis = b.dataset.v;
    if (S.basis === "next") S.conds.forEach(c => c.s = "cmp");
    document.querySelectorAll("#basis button").forEach(x => x.classList.toggle("on", x === b)); renderConds(); renderPeriodNote(); recompute(); };
  $("match").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.match = b.dataset.v;
    document.querySelectorAll("#match button").forEach(x => x.classList.toggle("on", x === b)); applyFilters(); };
  $("addCond").onclick = () => { S.conds.push({s:"cmp",op:"above",a:"R3",b:"R4",pct:2,n:5}); renderConds(); applyFilters(); };
  $("conds").addEventListener("change", e => {
    const el = e.target, box = el.closest(".cond"); if (!box) return;
    const c = S.conds[+box.dataset.i]; const f = el.dataset.f;
    c[f] = el.value;
    renderConds(); applyFilters();
  });
  $("conds").addEventListener("input", e => { const el = e.target, box = el.closest(".cond"); if (!box || el.type !== "number") return;
    S.conds[+box.dataset.i][el.dataset.f] = el.value; later(applyFilters); });
  $("conds").addEventListener("click", e => { const d = e.target.dataset.del; if (d == null) return; S.conds.splice(+d, 1); renderConds(); applyFilters(); });
  $("q").oninput = e => { S.q = e.target.value; later(applyFilters); };
  $("index").onchange = e => { S.index = e.target.value; applyFilters(); };
  $("sector").onchange = e => { S.sector = e.target.value; applyFilters(); };
  for (const id of ["fo","sme","bebz","stale"]) $(id).onchange = e => { S[id] = e.target.checked; applyFilters(); };
  $("ranges").addEventListener("input", e => { const el = e.target; if (!el.dataset.r) return;
    const v = S.ranges[el.dataset.r] || ["",""]; v[+el.dataset.j] = el.value; S.ranges[el.dataset.r] = v;
    el.parentElement.classList.toggle("active", v[0] !== "" || v[1] !== ""); later(applyFilters); });
  $("clearRanges").onclick = () => { S.ranges = {}; renderRanges(); applyFilters(); };
  $("reset").onclick = () => { S = DEFAULT_STATE(); buildControls(); recompute(); };
  $("lvlChips").onclick = e => { const c = e.target.closest(".chip"); if (!c) return; const n = c.dataset.l;
    S.lvl = S.lvl.includes(n) ? S.lvl.filter(x=>x!==n) : S.lvl.concat(n);
    const order = TYPES[S.type].levels.concat(["PH","PL"]); S.lvl.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
    renderLevelChips(); renderTable(); saveState(); };
  $("distLvl").onchange = e => { S.dist = e.target.value; recompute(); };
  $("thead").onclick = e => { const th = e.target.closest("th"); if (!th) return; const k = th.dataset.k;
    S.sort = {k, d: S.sort.k === k ? -S.sort.d : (k==="sym"||FIELD[k]?.f==="txt" ? 1 : -1)}; sortView(); renderTable(); saveState(); };
  $("tbody").onclick = e => { const tr = e.target.closest("tr"); if (tr) openDetail(ROWS[+tr.dataset.i]); };
  $("more").onclick = e => { if (e.target.id === "showMore"){ LIMIT = 1e9; renderTable(); } };
  $("btnReload").onclick = loadData;
  $("btnCsv").onclick = exportCsv;
  $("btnCols").onclick = openCols;
  $("btnHelp").onclick = openHelp;
  $("btnFilters").onclick = () => { $("side").classList.add("open"); $("overlay").classList.add("open"); };
  $("closeSide").onclick = closeAll;
  $("overlay").onclick = closeAll;
  $("mclose").onclick = closeAll;
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });
}
function closeAll(){ ["side","drawer","modal","overlay"].forEach(id => $(id).classList.remove("open")); }

/* ------------------------------------------------------------------ detail drawer */
function openDetail(o){
  const r = (l, v, f, unit="") => `<div class="ratio"><span>${l}</span><span>${fmt(v, f)}${v!=null&&unit?` <span class="sub">${unit}</span>`:""}</span></div>`;
  const ratios = [
    r("Market Cap", o.mcap, "cr", "Cr"), r("Current Price", o.close, "p"),
    `<div class="ratio"><span>52W High / Low</span><span>${fmt(o.h52,"p")} / ${fmt(o.l52,"p")}</span></div>`,
    r("Stock P/E", o.pe, "x"), r("Book Value", o.bv, "p"), r("Dividend Yield", o.dy, "pct", "%"),
    r("ROCE", o.roce, "pct", "%"), r("ROE", o.roe, "pct", "%"), r("Face Value", o.fv, "p"),
    r("No. Eq. Shares (Cr)", o.shares_cr, "x"), r("EPS (TTM)", o.eps, "p"), r("No. of Share Holders", o.holders, "int"),
    r("Price to book value", o.pb, "x"), r("Market Cap to Sales", o.mcap_sales, "x"), r("Industry PE", o.ind_pe, "x"),
    r("EPS growth (TTM)", o.eps_g, "pctS", "%"), r("PEG Ratio", o.peg, "x"), r("Return on equity (TTM)", o.roe_ttm, "pct", "%"),
    r("ROIC", o.roic, "pct", "%"), r("Piotroski score", o.pio, "int"), r("Debt to equity", o.de, "x"),
    r("OPM", o.opm, "pct", "%"), r("CMP / FCF", o.cmp_fcf, "x"), r("Sales growth (TTM)", o.sales_g, "pctS", "%"),
    r("Interest coverage", o.int_cov, "x"), r("Current ratio", o.cur_ratio, "x"), r("Profit growth (TTM)", o.profit_g, "pctS", "%"),
    r("RSI (14)", o.rsi, "x"), r("Delivery %", o.deliv, "pct", "%"), r("Volume ÷ 20D avg", o.vol_ratio, "x"),
  ].join("");
  const tfs = ["D","W","M","Q","Y"];
  const LV = {}; tfs.forEach(t => LV[t] = levelsFor(o, S.type, t, S.basis));
  const names = TYPES[S.type].levels;
  const nearest = {}; tfs.forEach(t => { if (!LV[t]) return; let b=null,bd=1e18; names.forEach(n => { const d = Math.abs(LV[t][n]-o.close); if (d<bd){bd=d;b=n;} }); nearest[t]=b; });
  const zoneRow = tfs.map(t => `<td><span class="zone ${zoneOf(o.close, LV[t], S.type).cls}">${esc(zoneOf(o.close, LV[t], S.type).z)}</span></td>`).join("");
  const lvRows = names.map(n => `<tr><td class="l"><b>${n}</b></td>${tfs.map(t => `<td class="${nearest[t]===n?"hit":""}">${fmt(LV[t]?LV[t][n]:null,"p")}</td>`).join("")}</tr>`).join("");
  const per = tfs.map(t => `<th>${TF_NAMES[t]}<div class="sub" style="font-weight:400">${esc(S.basis==="cur"?(D.meta.periods[t].cur):"next")}</div></th>`).join("");
  const tvSym = o.sym.replace(/[^A-Za-z0-9]/g, "_");
  $("drawer").innerHTML = `
    <div class="dhead">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
        <div><h2>${esc(o.name)}</h2>
          <div class="dprice">₹ ${fmt(o.close,"p")} <span style="font-size:15px">${fmt(o.chg,"pctS")}%</span>
            <span class="sub" style="font-weight:400">${o.stale?"last traded "+fmtDate(o.last):(D.meta.live&&o.last===D.meta.live.date?"live "+D.meta.live.time+" IST":"close "+fmtDate(o.last))}</span></div>
          <div class="links"><span class="sub">NSE: <b>${esc(o.sym)}</b> · ${esc(o.series)}${o.fo?" · F&O":""}${o.idx?" · "+esc(o.idx.replace(/,/g,", ")):""}</span></div>
          <div class="links">
            <a href="https://www.screener.in/company/${encodeURIComponent(o.sym)}/" target="_blank" rel="noopener">Screener.in ↗</a>
            <a href="https://in.tradingview.com/chart/?symbol=NSE%3A${encodeURIComponent(tvSym)}" target="_blank" rel="noopener">TradingView chart ↗</a>
            <a href="https://www.nseindia.com/get-quotes/equity?symbol=${encodeURIComponent(o.sym)}" target="_blank" rel="noopener">NSE quote ↗</a>
          </div></div>
        <button class="x" style="font-size:28px" onclick="closeAll()">×</button>
      </div>
    </div>
    <div class="dbody">
      <div class="card"><div class="ratios">${ratios}</div></div>
      <div class="sub" style="margin:8px 2px 18px">${esc(o.sector||"")}${o.industry?" · "+esc(o.industry):""}${o.next_res?" · Next results ~"+fmtDate(o.next_res):""}${o.ca?" · Price history adjusted for: "+esc(o.ca):""}</div>
      <div class="card" style="padding:4px 0 8px">
        <div style="padding:12px 16px 4px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><b>${S.type} pivot levels — ${S.basis==="cur"?"current periods":"next periods (developing)"}</b><span class="sub">Highlighted = level nearest to CMP</span></div>
        <div style="overflow:auto"><table class="lvls"><thead><tr><th class="l">Level</th>${per}</tr></thead>
          <tbody><tr class="cmp"><td class="l">CMP zone</td>${zoneRow}</tr>${lvRows}
          <tr><td class="l sub">Prev H / L / C</td>${tfs.map(t=>{const p=S.basis==="cur"?D.piv[t][o.i]:null;return `<td class="sub">${p&&p[1]!=null?`${fmt(p[1],"p")}<br>${fmt(p[2],"p")}<br>${fmt(p[3],"p")}`:"–"}</td>`}).join("")}</tr>
          </tbody></table></div>
      </div>
      <p class="sub" style="margin-top:14px">Fundamentals: TradingView feed (may differ slightly from Screener.in, which uses its own definitions). Prices &amp; levels: NSE official bhavcopy, split/bonus-adjusted. Not investment advice.</p>
    </div>`;
  $("drawer").classList.add("open"); $("overlay").classList.add("open");
}

/* ------------------------------------------------------------------ columns / help / csv */
function openCols(){
  const groups = [...new Set(FIELDS.map(f=>f.g))];
  $("mtitle").textContent = "Choose table columns";
  $("mbody").innerHTML = groups.map(g => `<h4 style="margin:12px 0 6px">${g}</h4><div class="colgrid">` +
    FIELDS.filter(f=>f.g===g).map(f => `<label class="check"><input type="checkbox" data-c="${f.k}" ${S.cols.includes(f.k)?"checked":""}> ${esc(f.l)}</label>`).join("") + "</div>").join("") +
    `<div style="margin-top:16px;display:flex;gap:8px"><button class="btn" id="colsDefault">Restore defaults</button><button class="btn primary" onclick="closeAll()">Done</button></div>`;
  $("mbody").onchange = e => { const k = e.target.dataset.c; if (!k) return;
    S.cols = e.target.checked ? S.cols.concat(k) : S.cols.filter(x => x !== k);
    S.cols.sort((a,b) => FIELDS.findIndex(f=>f.k===a) - FIELDS.findIndex(f=>f.k===b)); renderTable(); saveState(); };
  $("mbody").onclick = e => { if (e.target.id === "colsDefault"){ S.cols = DEFAULT_COLS.slice(); openCols(); renderTable(); saveState(); } };
  $("modal").classList.add("open"); $("overlay").classList.add("open");
}
function openHelp(){
  const m = D ? D.meta : null;
  $("mtitle").textContent = "How this screener works";
  $("mbody").innerHTML = `
    <p><b>Data.</b> Prices come from NSE's official end-of-day bhavcopy (nsearchives.nseindia.com). A GitHub Action downloads each new day after market close (~7 pm IST) and, during market hours, refreshes prices every ~30 minutes from TradingView (about 15 min delayed). Every time you open this page it loads the newest file.${m?` Current file: NSE data up to <b>${fmtDate(m.nse_date)}</b>${m.live?`, live prices at <b>${m.live.time} IST</b>`:""}; history from ${fmtDate(m.history_from)}.`:""}</p>
    <p><b>Pivot periods.</b> "Current period" levels use the previous completed period's High, Low and Close — exactly what TradingView's <i>Pivot Points Standard</i> draws. With pivots set to <i>Auto</i>, TradingView uses Daily levels on ≤15-min charts, Weekly on other intraday charts, Monthly on daily charts and <b>Yearly on weekly/monthly charts</b>. "Next period" builds levels from the period in progress (they firm up when it ends).</p>
    <p><b>Camarilla formulas</b> (H, L, C of the previous period): R1/S1 = C ± 1.1×(H−L)/12 · R2/S2 = C ± 1.1×(H−L)/6 · R3/S3 = C ± 1.1×(H−L)/4 · R4/S4 = C ± 1.1×(H−L)/2 · R5 = (H/L)×C, S5 = C − (R5 − C) · P = (H+L+C)/3. TradingView rounds levels to the tick size (₹0.05), so 704.875 displays there as 704.90.</p>
    <p><b>Conditions.</b> "Crossed above R4 (N days)" = today's close is above R4 and at least one of the previous N closes was at or below it. "Period high so far" lets you find stocks that touched a level intraday during the period even if they closed back below.</p>
    <p><b>Splits &amp; bonuses.</b> History is adjusted using NSE's daily share count (MCAP file) so yearly highs/lows match TradingView's adjusted charts.</p>
    <p><b>Fundamentals</b> (P/E, ROCE, ROE, growth, Piotroski…) come from TradingView's screener feed in one request; definitions can differ slightly from Screener.in. Not available from free sources: pledged %, 3/5-year EPS growth, ROE 5-yr variance. Market cap = NSE share count × price. P/E = price ÷ TTM EPS. Industry P/E = median P/E of profitable stocks in the same industry.</p>
    <p><b>Tips.</b> Click a column header to sort, a row for full detail, <i>Columns</i> to add metrics, <i>Export CSV</i> to take the list to Excel. Your filters are saved in the page link — bookmark it to keep a screen.</p>
    <p class="sub">For research only — not investment advice. Verify levels on your chart before trading.</p>`;
  $("modal").classList.add("open"); $("overlay").classList.add("open");
}
function exportCsv(){
  if (!VIEW.length) return;
  const cols = [["sym","Symbol"],["name","Company"],["series","Series"],["zone","Zone"]]
    .concat(TYPES[S.type].levels.map(n => ["L:"+n, `${S.type} ${TF_NAMES[S.tf]} ${n}`]))
    .concat([["dist",`Δ% vs ${S.dist}`]]).concat(FIELDS.map(f => [f.k, f.l]));
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const lines = [cols.map(c => q(c[1])).join(",")];
  for (const o of VIEW) lines.push(cols.map(([k]) => q(k.startsWith("L:") ? (o.L ? plain(o.L[k.slice(2)]) : "") : plain(o[k], FIELD[k]?.f))).join(","));
  const blob = new Blob(["﻿" + lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `nse-screener-${S.type}-${TF_NAMES[S.tf]}-${D.meta.latest}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

wire();
loadData();
</script>
</body>
